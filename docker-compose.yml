version: '3.8'

services:
  app:
    build: .
    container_name: kiru-leathers-app
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=kiru_admin
      - MYSQL_PASSWORD=kiru_secure_pass_2026
      - MYSQL_DATABASE=kiru_atelier
      - JWT_SECRET=kiru_atelier_artisan_secret_key_2026
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: kiru-leathers-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass_2026
      MYSQL_DATABASE: kiru_atelier
      MYSQL_USER: kiru_admin
      MYSQL_PASSWORD: kiru_secure_pass_2026
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
