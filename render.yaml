services:
  - type: web
    name: kiru-leathers
    env: node
    plan: starter
    buildCommand: npm install && cd server && npm install && cd .. && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
